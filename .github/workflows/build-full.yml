name: Build Full ARM64 unsigned (manual)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Tarefas Ninja; 2 reduz pressao de RAM, 4 usa mais memoria
        required: true
        default: '2'
        type: choice
        options: ['2', '4']
      accept_ndk_preview_license:
        description: Li e aceito o Android SDK Preview License Agreement da Google para o NDK r30 beta1
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: blender-alpha3-full-unsigned
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Used only by the final gh step to create a draft release; no personal token.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      JOBS: ${{ inputs.jobs }}
      MIN_FREE_GIB: '40'
      SIGN_APK: '0'
    steps:
      - name: Verificar aceite explicito e obter este commit publico
        env:
          ACCEPT_NDK_PREVIEW_LICENSE: ${{ inputs.accept_ndk_preview_license }}
        run: |
          set -euo pipefail
          if [[ "$ACCEPT_NDK_PREVIEW_LICENSE" != true ]]; then
            printf 'O Android SDK Preview License Agreement da Google nao foi aceito. Nenhuma instalacao ou compilacao iniciada.\n' >&2
            exit 1
          fi
          [[ "$JOBS" == 2 || "$JOBS" == 4 ]]
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config core.autocrlf false
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          printf '## Build experimental unsigned\n\nRunner padrao publico, limite 6 horas, JOBS=%s.\n' "$JOBS" >> "$GITHUB_STEP_SUMMARY"
          printf 'Sem limpeza de ferramentas, cache remoto ou Actions artifacts. Assinatura local posterior.\n' >> "$GITHUB_STEP_SUMMARY"
          df -hT "$GITHUB_WORKSPACE"
          free -h
          nproc

      - name: Preparar compiladores e ferramentas
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang-18 cmake ninja-build patchelf \
            zip unzip git-lfs openjdk-17-jdk python3 python3-pip ca-certificates time
          [[ -x "$JAVA_HOME_17_X64/bin/javac" ]]
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          command -v gh
          git lfs version
          clang-18 --version
          cmake --version
          ninja --version

      - name: Instalar a revisao exata do NDK e SDK
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$sdkmanager_path" ]]
          # Bind consent to the exact preview agreement presented for review.
          # Changed terms or a different package/license association stop here.
          python3 - <<'PY'
          import hashlib
          import urllib.request
          import xml.etree.ElementTree as ET

          url = 'https://dl.google.com/android/repository/repository2-3.xml'
          expected = '8a75fe5d27e03e154ec5d7c2d2b9130386278f8662a207ac6ba6b53ae7d52982'
          with urllib.request.urlopen(url, timeout=30) as response:
              data = response.read(8 * 1024 * 1024 + 1)
          if len(data) > 8 * 1024 * 1024:
              raise SystemExit('Catalogo SDK excedeu o limite de verificacao; nenhum aceite realizado.')
          root = ET.fromstring(data)
          local_name = lambda node: node.tag.rsplit('}', 1)[-1]
          licenses = [node for node in root if local_name(node) == 'license'
                      and node.get('id') == 'android-sdk-preview-license']
          packages = [node for node in root if local_name(node) == 'remotePackage'
                      and node.get('path') == 'ndk;30.0.14904198']
          if len(licenses) != 1 or len(packages) != 1:
              raise SystemExit('Pacote/licenca esperado nao localizado; nenhum aceite realizado.')
          license_refs = [node.get('ref') for node in packages[0]
                          if local_name(node) == 'uses-license']
          digest = hashlib.sha256(''.join(licenses[0].itertext()).strip().encode('utf-8')).hexdigest()
          if digest != expected or license_refs != ['android-sdk-preview-license']:
              raise SystemExit('O acordo NDK mudou: revise os novos termos antes de aceitar. Nenhum aceite realizado.')
          print('Acordo NDK confere com o texto revisado: SHA256=' + digest)
          PY
          # Accept only the agreement requested for this specific NDK package,
          # after the explicit workflow input gate above. Never run --licenses.
          # yes may exit on SIGPIPE after sdkmanager finishes; check sdkmanager's
          # status, retaining real download/installation errors.
          set +e
          yes | "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install --channel=3 \
            'ndk;30.0.14904198'
          ndk_status=${PIPESTATUS[1]}
          set -e
          if [[ "$ndk_status" -ne 0 ]]; then
            printf 'A instalacao do NDK falhou (codigo %s).\n' "$ndk_status" >&2
            exit "$ndk_status"
          fi
          # Other SDK packages may use only the licenses already on the runner.
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --install --channel=3 \
            'build-tools;35.0.1' 'platforms;android-35' 'platform-tools' </dev/null
          cat "$ANDROID_HOME/ndk/30.0.14904198/source.properties"
          df -hT "$GITHUB_WORKSPACE"

      - name: Compilar e validar o pacote unsigned
        id: compile_apk
        timeout-minutes: 315
        run: |
          set -euo pipefail
          bash build/build-full-ubuntu24.sh "$RUNNER_TEMP/blender-alpha3-build"

      - name: Resumo final de recursos
        if: always()
        run: |
          set -euo pipefail
          {
            printf '\n### Recursos no fim da execucao\n\n```text\n'
            df -hT "$GITHUB_WORKSPACE"
            free -h
            printf '```\n\nO sucesso do build nao comprova funcionamento em Android.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recuperar APK e evidencias, inclusive apos falha de validacao
        id: recover_apk
        if: ${{ !cancelled() && (steps.compile_apk.outcome == 'success' || steps.compile_apk.outcome == 'failure') }}
        env:
          BUILD_STEP_OUTCOME: ${{ steps.compile_apk.outcome }}
        run: |
          set -euo pipefail
          printf 'available=false\n' >> "$GITHUB_OUTPUT"
          task="$RUNNER_TEMP/blender-alpha3-build"
          output="$task/output"
          review="$task/release-review"
          candidate="$output/blender-alpha3-modificadores-full-arm64-unsigned.apk"
          origin=recipe_output
          if [[ ! -s "$candidate" ]]; then
            candidate="$task/blender_build_android/android_apk_stage_full/blender-full.apk"
            origin=upstream_packaging_stage
          fi
          if [[ ! -s "$candidate" ]]; then
            printf '\n### Recuperacao\n\nNenhum APK foi produzido; nenhum draft Release sera criado.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Do not mislabel a partial, signed unexpectedly, or rejected package as
          # a validated unsigned result. Keep the recipe's failure visible.
          validation=UNVALIDATED
          apk_name=blender-alpha3-modificadores-full-arm64-UNVALIDATED.apk
          if [[ "$BUILD_STEP_OUTCOME" == success && "$origin" == recipe_output ]]; then
            validation=BUILD_CHECKS_PASSED
            apk_name=blender-alpha3-modificadores-full-arm64-unsigned.apk
          fi
          # Releases permits at most 2 GiB per asset. No secondary failure if a
          # failed build has left an oversized partial file that cannot upload.
          if [[ "$(stat -c %s "$candidate")" -ge 2147483648 ]]; then
            printf '\n### Recuperacao\n\nAPK excede o limite de 2 GiB por asset; draft nao criado.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$review"
          cp -- "$candidate" "$review/$apk_name"
          # Preserve any original reports separately. A recovery manifest must
          # never invent the recipe manifest or claim requested SDK values were observed.
          for name in build-manifest.txt apk-badging.txt apk-signature.txt; do
            if [[ -f "$output/$name" ]]; then
              cp -- "$output/$name" "$review/recipe-$name"
            fi
          done
          report_status() {
            local name="$1" tool="$2" status
            shift 2
            if [[ -x "$tool" ]]; then
              if "$tool" "$@" > "$review/$name" 2>&1; then
                status=0
              else
                status=$?
              fi
            else
              printf 'NOT_AVAILABLE: tool missing: %s\n' "$tool" > "$review/$name"
              status=NOT_AVAILABLE
            fi
            printf '%s_exit_status=%s\n' "${name%.txt}" "$status" >> "$review/report-status.txt"
          }
          : > "$review/report-status.txt"
          bt="${ANDROID_HOME:-}/build-tools/35.0.1"
          report_status apk-badging.txt "$bt/aapt2" dump badging "$review/$apk_name"
          report_status apk-signature.txt "$bt/apksigner" verify --verbose --print-certs "$review/$apk_name"
          report_status apk-zipalign.txt "$bt/zipalign" -c -p 4 "$review/$apk_name"
          printf 'A nonzero signature verification status is expected for an unsigned APK; it is not proof of any other validation.\n' \
            >> "$review/report-status.txt"
          if [[ -f "$task/logs/build-full.log" ]]; then
            tail -c 1048576 "$task/logs/build-full.log" | tail -n 2000 > "$review/build-log-tail.txt" || true
          else
            printf 'NOT_AVAILABLE: build-full.log was not created.\n' > "$review/build-log-tail.txt"
          fi
          {
            printf 'repository=%s\nrepository_commit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf 'workflow_run=%s/%s/actions/runs/%s\nrun_attempt=%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'requested_source_commit=89479ec817bfe9411ae6ef6f35392d5450e1ad0b\n'
            printf 'source_url=https://github.com/simfeo/blender/tree/89479ec817bfe9411ae6ef6f35392d5450e1ad0b\n'
            for pair in source:source linux_lib:source/lib/linux_x64 android_lib:source/lib/android_arm64 vulkan_headers:blender_build_android/lib/vulkan_headers; do
              observed="$(git -C "$task/${pair#*:}" rev-parse HEAD 2>/dev/null || true)"
              printf 'observed_%s_commit=%s\n' "${pair%%:*}" "${observed:-NOT_AVAILABLE}"
            done
          } > "$review/source-provenance.txt"
          for name in blender-alpha3-modificadores.patch LICENSE; do
            if [[ -f "$GITHUB_WORKSPACE/$name" ]]; then
              cp -- "$GITHUB_WORKSPACE/$name" "$review/$name"
              printf '%s=INCLUDED\n' "$name" >> "$review/source-provenance.txt"
            else
              printf '%s=NOT_AVAILABLE\n' "$name" >> "$review/source-provenance.txt"
            fi
          done
          if [[ -f "$task/applied-source.diff" ]]; then
            cp -- "$task/applied-source.diff" "$review/source-applied.diff"
          fi
          {
            printf 'artifact_status=%s\nbuild_step_outcome=%s\n' "$validation" "$BUILD_STEP_OUTCOME"
            printf 'artifact_filename=%s\nartifact_origin=%s\n' "$apk_name" "$origin"
            printf 'recovered_at_utc=%s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            printf 'requested_configuration=full\nrequested_abi=arm64-v8a\nrequested_min_sdk=31\nrequested_target_sdk=34\nrequested_compile_sdk=35\n'
            printf 'requested_sign_apk=0\nparallel_jobs=%s\n' "$JOBS"
            printf 'observed_package_metadata=apk-badging.txt\nreport_exit_statuses=report-status.txt\n'
            printf 'source_provenance=source-provenance.txt\nchecksums=SHA256SUMS.txt\n'
            printf 'local_signing=NOT_PERFORMED_BY_WORKFLOW\ndevice_runtime_test=NOT_PERFORMED\n'
            printf 'UNVALIDATED means no successful final build verification; recovery does not change the original build result.\n'
          } > "$review/build-manifest.txt"
          {
            printf '# %s — APK experimental para revisao\n\n' "$validation"
            printf 'Resultado da etapa de compilacao/checagem: `%s`. Origem recuperada: `%s`.\n\n' "$BUILD_STEP_OUTCOME" "$origin"
            printf 'Configuracao solicitada: Full ARM64 unsigned. Os valores observados e o estado da assinatura estao nos relatorios anexos.\n\n'
            if [[ "$validation" == UNVALIDATED ]]; then
              printf '**UNVALIDATED: a verificacao final nao concluiu com sucesso. Este APK foi preservado para diagnostico e nao deve ser tratado como instalador validado.**\n\n'
            fi
            printf 'Assinatura local estavel e teste funcional no aparelho ainda pendentes. Manter em draft; nao publicar como instalador validado.\n\n'
            printf 'Fonte, patch, licenca, checksums e relatorios disponiveis acompanham o pacote. Ausencias e falhas de ferramentas estao declaradas nos manifests. O log contem somente seu trecho final.\n'
          } > "$review/release-notes.md"
          (
            cd "$review"
            sha256sum -- * > "$task/release-review-SHA256SUMS.txt"
            mv -- "$task/release-review-SHA256SUMS.txt" SHA256SUMS.txt
          )
          printf 'available=true\nvalidation=%s\n' "$validation" >> "$GITHUB_OUTPUT"
          printf '\n### APK preservado\n\nEstado: **%s**. A recuperacao nao altera o resultado original da compilacao.\n' \
            "$validation" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK e evidencias em draft Release (sem Actions artifact)
        if: ${{ !cancelled() && steps.recover_apk.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APK_VALIDATION: ${{ steps.recover_apk.outputs.validation }}
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/blender-alpha3-build/release-review"
          assets=("$review"/*)
          tag="build-unsigned-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          release_url="$(gh release create "$tag" \
            "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Blender Alpha 3 Full ARM64 $APK_VALIDATION - $GITHUB_RUN_ID" \
            --notes-file "$review/release-notes.md")"
          printf '\n### Resultado para revisao\n\nDraft Release: %s\n\nEstado: **%s**. Sem assinatura local final e sem teste no aparelho.\n' \
            "$release_url" "$APK_VALIDATION" >> "$GITHUB_STEP_SUMMARY"
