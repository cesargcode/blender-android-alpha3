name: Teste do envio para draft Release (sem APK)

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: blender-alpha3-release-upload-test
  cancel-in-progress: false

jobs:
  test_upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Obter o commit exato sem persistir credenciais
        run: |
          set -euo pipefail
          # Same public, SHA-pinned checkout as the build workflow. No token is
          # supplied to Git and no credentials are written to its configuration.
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" config core.autocrlf false
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth 1 origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --detach "$GITHUB_SHA"
          [[ "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" == "$GITHUB_SHA" ]]
          command -v gh
          command -v python3
          printf '## Teste real do envio para draft Release\n\nSomente arquivos de texto pequenos; nenhum APK, SDK, aceite de licenca ou build.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Criar arquivos pequenos e uma evidencia vazia
        run: |
          set -euo pipefail
          review="$RUNNER_TEMP/release-upload-test"
          tag="upload-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$review"
          printf 'TESTE DE UPLOAD. ESTE ARQUIVO NAO E UM APK OU INSTALADOR.\nRun=%s attempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$review/UPLOAD-TEST-NOT-AN-APK.txt"
          : > "$review/empty-evidence.txt"
          printf 'TESTE: evidencia normal, pequena e nao vazia.\ncontains_apk=false\n' > "$review/normal-evidence.txt"
          cat > "$review/release-notes.md" <<'NOTES'
          # TESTE DE UPLOAD — NAO E UM APK

          Esta release de rascunho testa o envio de arquivos pequenos ao GitHub.
          Nao contem aplicativo, instalador ou resultado de compilacao.
          A evidencia originalmente vazia deve ser normalizada antes do hash.
          A release permanece em rascunho; nao publicar como versao do Blender.
          NOTES
          printf 'UPLOAD_TEST_REVIEW=%s\nUPLOAD_TEST_TAG=%s\n' "$review" "$tag" >> "$GITHUB_ENV"

      - name: Enviar pelo mesmo uploader usado pelo build
        id: upload
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash build/upload-draft-release.sh \
            "$UPLOAD_TEST_REVIEW" \
            UPLOAD-TEST-NOT-AN-APK.txt \
            "$UPLOAD_TEST_TAG" \
            "TESTE de upload ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} — NAO E UM APK"

      - name: Verificar draft, estado, tamanho e SHA256 no GitHub
        if: ${{ !cancelled() && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['UPLOAD_TEST_TAG']
          review = Path(os.environ['UPLOAD_TEST_REVIEW'])

          def api_pages(endpoint):
              result = subprocess.run(
                  ['gh', 'api', '--paginate', '--slurp', endpoint],
                  check=True, stdout=subprocess.PIPE)
              return [item for page in json.loads(result.stdout) for item in page]

          # Listing authenticated releases includes drafts, unlike APIs that
          # select only a published release by its tag.
          releases = [item for item in api_pages(f'repos/{repository}/releases?per_page=100')
                      if item['tag_name'] == tag]
          if len(releases) != 1 or releases[0]['draft'] is not True:
              raise SystemExit('Falha: release de teste unica em rascunho nao encontrada.')
          release = releases[0]
          files = {path.name: path for path in review.iterdir() if path.is_file()}
          expected = {'UPLOAD-TEST-NOT-AN-APK.txt', 'empty-evidence.txt',
                      'normal-evidence.txt', 'release-notes.md', 'SHA256SUMS.txt'}
          if set(files) != expected or any(path.stat().st_size == 0 for path in files.values()):
              raise SystemExit('Falha: arquivos locais incompletos ou evidencia vazia nao normalizada.')
          local_hashes = {name: hashlib.sha256(path.read_bytes()).hexdigest()
                          for name, path in files.items()}
          sums = {}
          for line in files['SHA256SUMS.txt'].read_text(encoding='utf-8').splitlines():
              digest, name = line.split(maxsplit=1)
              sums[name.lstrip('* ')] = digest
          if sums != {name: digest for name, digest in local_hashes.items() if name != 'SHA256SUMS.txt'}:
              raise SystemExit('Falha: SHA256SUMS nao corresponde aos arquivos apos normalizacao.')
          assets = api_pages(f"repos/{repository}/releases/{release['id']}/assets?per_page=100")
          if len(assets) != len(files) or {asset['name'] for asset in assets} != set(files):
              raise SystemExit('Falha: conjunto de assets remoto diferente dos arquivos locais.')
          rows = []
          for asset in sorted(assets, key=lambda item: item['name']):
              name = asset['name']
              size = files[name].stat().st_size
              if asset['state'] != 'uploaded' or asset['size'] != size:
                  raise SystemExit(f'Falha: estado ou tamanho incorreto para {name}.')
              digest = asset.get('digest')
              if digest:
                  if digest.lower() != 'sha256:' + local_hashes[name]:
                      raise SystemExit(f'Falha: SHA256 remoto incorreto para {name}.')
                  verified_by = 'digest da API'
              else:
                  result = subprocess.run(
                      ['gh', 'api', '-H', 'Accept: application/octet-stream',
                       f"repos/{repository}/releases/assets/{asset['id']}"],
                      check=True, stdout=subprocess.PIPE)
                  if len(result.stdout) != size or hashlib.sha256(result.stdout).hexdigest() != local_hashes[name]:
                      raise SystemExit(f'Falha: conteudo baixado diferente para {name}.')
                  verified_by = 'download + SHA256'
              rows.append(f'| `{name}` | uploaded | {size} | {verified_by} |')
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('\n### Verificacao concluida\n\n')
              summary.write(f"[Draft de teste]({release['html_url']}) permanece em rascunho. Nenhum APK foi enviado.\n\n")
              summary.write('| Arquivo | Estado | Bytes | Verificacao |\n| --- | --- | ---: | --- |\n')
              summary.write('\n'.join(rows) + '\n')
          print(f'PASS: {len(assets)} assets de texto verificados; release permanece draft.')
          PY
